<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Admin - Atelier Nova</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
    <div class="admin-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">Atelier <span>Nova</span></div>
            <nav id="sideNav">
                <a href="#/dashboard" data-route="dashboard"><i class="fas fa-grip"></i> Dashboard</a>
                <a href="#/settings" data-route="settings"><i class="fas fa-sliders"></i> Studio settings</a>
                <a href="#/home" data-route="home"><i class="fas fa-house"></i> Home page</a>
                <a href="#/about" data-route="about"><i class="fas fa-landmark"></i> About page</a>
                <a href="#/services" data-route="services"><i class="fas fa-drafting-compass"></i> Services</a>
                <a href="#/projects" data-route="projects"><i class="fas fa-building"></i> Projects</a>
                <a href="#/testimonials" data-route="testimonials"><i class="fas fa-star"></i> Testimonials</a>
                <a href="#/careers" data-route="careers"><i class="fas fa-briefcase"></i> Careers</a>
                <a href="#/inquiries" data-route="inquiries"><i class="fas fa-inbox"></i> Inquiries</a>
                <a href="#/applications" data-route="applications"><i class="fas fa-file-lines"></i> Applications</a>
                <a href="#/media" data-route="media"><i class="fas fa-images"></i> Media library</a>
                <a href="#/preview" data-route="preview"><i class="fas fa-eye"></i> Website preview</a>
            </nav>
            <div class="sidebar-foot">
                <button id="logoutBtn" type="button"><i class="fas fa-right-from-bracket"></i> Sign out</button>
            </div>
        </aside>
        <div class="main">
            <div class="topbar">
                <h2 id="pageTitle">Dashboard</h2>
                <div>
                    <a class="btn btn-ghost btn-sm" href="../index.html" target="_blank"><i class="fas fa-arrow-up-right-from-square"></i> Open website</a>
                </div>
            </div>
            <div class="content" id="app"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="modal-bg" id="modalBg"></div>
    <script src="assets/admin.js"></script>
</body>
</html>
